# Ego to Lidar transformation (4x4 SE(3) matrix)
# Transforms points from Ego (vehicle) frame to Lidar frame
ego_to_lidar:
  - [0.9999,  0.0000, -0.0117, -1.4328]
  - [0.0001,  0.9999,  0.0101, -0.0149]
  - [0.0117, -0.0101,  0.9999, -1.4768]
  - [0     ,  0     ,  0     ,  1.0000]

# Lidar to Ego transformation (4x4 SE(3) matrix)
# Transforms points from Lidar frame to Ego (vehicle) frame
lidar_to_ego:
  - [ 0.9999, 0.0001,  0.0117, 1.4500]
  - [      0, 0.9999, -0.0101,      0]
  - [-0.0117, 0.0101,  0.9999, 1.4600]
  - [      0,      0,       0, 1.0000]