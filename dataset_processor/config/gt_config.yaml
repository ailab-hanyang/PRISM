# ===== Coordinate Transform (LiDAR → Camera, meters) =====
coordinate_transform:
  offset_x: 0.0       # x-axis offset (m)
  offset_y: 0.0       # y-axis offset (m)
  offset_z: 1.8       # z-axis offset (m)

# ===== ROI Settings (Camera coordinate system, cm) =====
# Camera coordinates (ground projection): x=forward(longitudinal), y=lateral, z=vertical
roi:
  x_min: 700.0        # Start point (cm) - 7.00m
  x_max: 1200.0       # End point (cm) - 11.92m
  y_min: -200.0       # Left (cm)
  y_max: 200.0        # Right (cm)
  z_min: -20.0        # Bottom (cm) - ground ±20cm
  z_max: 20.0         # Top (cm)

roi_v2:
  z_min: -200.0       # Bottom (cm) - ground ±200cm
  z_max: 200.0        # Top (cm)

# ===== Grid Resolution (cm) =====
grid:
  resolution_x: 10.0  # 10cm (forward)
  resolution_y: 10.0  # 10cm (lateral)
  resolution_z: 1.0   # 1cm (vertical)

gt_folder_name: "elevation_map_10cmx10cm"

include_normal_gt: True  # Include normal vector GT

# ===== Visualization Settings =====
visualization:
  pkl_path: "0106_dataset/sequence_001/elevation_map_10cmx10cm/1767667361_605.pkl"
  pcd_path: "0106_dataset/sequence_001/lidar_accum_scan/1767667361_605.pcd"
  output_path: "visualization_output.png"
