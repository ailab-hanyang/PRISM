# PRISM Dataset PKL Converter Configuration
#
# Required environment variables:
#   export PRISM_DATASET_ROOT=/path/to/data    # Dataset root
#   export PRISM_DEVKIT_ROOT=/path/to/PRISM    # Project root

# ===== Dataset Paths =====
